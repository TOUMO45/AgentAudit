[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.1.0"
description = "The missing security layer for Strands agents: three-layer adversarial audit (behavior, tool-trust boundaries, AWS/AgentCore posture) in one signed scorecard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentAudit contributors" }]
keywords = ["strands", "agentcore", "security", "red-team", "sast", "sarif", "aws", "bedrock"]

# Core stack — fixed by the project charter. No dependency is added here
# without explicit human sign-off (charter rule 3).
dependencies = [
    "strands-agents>=1.55",
    "strands-agents-evals>=1.2",
    "boto3>=1.40",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
agentaudit = "agentaudit.cli:main"

[project.urls]
Homepage = "https://github.com/agentaudit/agentaudit"

[tool.setuptools]
packages = ["agentaudit", "agentaudit.layers", "agentaudit.report"]

[tool.setuptools.package-data]
"agentaudit.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
