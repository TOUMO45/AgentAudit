<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentAudit — Security Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420; --surface:#161D2B; --surface2:#1C2536; --line:#28324A;
    --text:#E6EDF3; --muted:#8B97A7; --muted2:#5E6B7E;
    --crit:#F0486B; --high:#D9772A; --med:#F6EC72; --low:#57A8F6; --info:#8B97A7;
    --pass:#3FB98A;
    --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
       background-image:radial-gradient(circle at 18% -12%,#172033 0,var(--ink) 55%);}
  code,.mono{font-family:var(--mono)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 70px}

  header.bar{display:flex;align-items:center;gap:18px;padding:18px 0;
             border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px}.brand b{color:var(--pass)}
  .live-chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);
             background:var(--surface);border-radius:999px;padding:5px 11px;color:var(--muted)}
  .live-chip .d{color:var(--pass)}
  header .spacer{flex:1}
  button{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
         border-radius:8px;border:1px solid var(--line);background:var(--surface);
         color:var(--text);padding:8px 14px;transition:.15s}
  button:hover{background:var(--surface2);border-color:#3a4763}
  button.primary{background:var(--pass);color:#06231a;border-color:transparent;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--low);outline-offset:2px}
  select,input{font-family:var(--mono);font-size:12px;background:var(--surface);
               color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

  nav.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  nav.tabs button{border-radius:8px}
  nav.tabs button.on{background:var(--surface2);border-color:#3a4763;color:#fff}

  .verified{font-family:var(--mono);font-size:11px;color:var(--muted2);margin-bottom:10px}
  .verified b{color:var(--muted)}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;
         padding:34px;text-align:center;color:var(--muted)}
  .empty .t{font-weight:600;color:var(--text);margin-bottom:6px}
  .unavail{border-left:3px solid var(--high)}
  h2.sec{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
         font-weight:600;margin:26px 0 12px}

  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
  .stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stage .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .stage .h .n{font-weight:600;font-size:14px;text-transform:capitalize;flex:1}
  .stage .icn{width:19px;height:19px;color:var(--muted)}
  .st{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:5px;letter-spacing:.4px}
  .st.ran{background:rgba(63,185,138,.15);color:var(--pass)}
  .st.pend{background:var(--surface2);color:var(--muted)}
  .st.run{background:rgba(87,168,246,.15);color:var(--low)}
  .st.skipped{background:var(--surface2);color:var(--muted)}
  .stage .detail{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
  /* NOTE: named .pbar (not .bar) — `.bar` would collide with <header class="bar">
     and zero its width, collapsing the whole header. */
  .barwrap{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px}
  .pbar{height:100%;width:0;background:var(--low);transition:width .4s ease}
  .pbar.done{background:var(--pass);width:100%}

  /* summary */
  .summary{display:flex;gap:26px;align-items:center;background:var(--surface);
           border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:8px;flex-wrap:wrap}
  .ring{width:126px;height:126px;flex:0 0 auto}
  .sumtxt{flex:1;min-width:230px}
  .sumtxt .tgt{font-family:var(--mono);font-size:15px;word-break:break-all;margin-bottom:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;padding:5px 11px;border-radius:7px;
        border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;gap:7px}
  .chip .sw{width:9px;height:9px;border-radius:2px}
  .chip.zero{opacity:.42}

  /* findings */
  details.f{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sev);
            border-radius:10px;margin-bottom:9px;overflow:hidden}
  details.f[open]{background:var(--surface2)}
  summary.frow{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:11px}
  summary.frow::-webkit-details-marker{display:none}
  summary.frow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--low)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--sev);flex:0 0 auto}
  .sv{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--sev);width:62px;flex:0 0 auto}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);
       border-radius:6px;padding:3px 7px;flex:0 0 auto}
  .fmain{flex:1;min-width:0}
  .fmain .d{font-family:var(--mono);font-size:12.5px}
  .fmain .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .fbody{padding:0 15px 15px 40px;font-size:13px;color:#C6D0DC;line-height:1.55}
  .kv{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:10px 0}
  .kv b{color:var(--text);font-weight:500}
  pre{background:#0B111C;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
      font-family:var(--mono);font-size:11.5px;overflow-x:auto;margin:0}
  pre .add{color:#69D19B} pre .del{color:#F0869C}

  /* tables */
  table{width:100%;border-collapse:collapse;background:var(--surface);
        border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--muted);
     text-transform:uppercase;cursor:pointer;user-select:none;background:var(--surface2)}
  th:hover{color:var(--text)}
  tr:last-child td{border-bottom:none}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--surface2)}
  td.mono{font-family:var(--mono);font-size:12px}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:5px}
  .pill.dry{background:var(--surface2);color:var(--muted)}
  .pill.active{background:rgba(63,185,138,.15);color:var(--pass)}
  .pill.error{background:rgba(240,72,107,.16);color:var(--crit)}
  .grade{font-family:var(--mono);font-weight:700}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--surface2);
         border:1px solid var(--line);border-left:3px solid var(--low);border-radius:10px;
         padding:13px 16px;font-size:13px;max-width:400px;display:none;z-index:50}
  @media (max-width:820px){ .pipe{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Agent<b>Audit</b> <span style="color:var(--muted2);font-weight:400">security console</span></div>
    <span class="live-chip"><span class="d">&#9679;</span> <span id="datamode">live data — nothing mocked</span></span>
    <div class="spacer"></div>
    <select id="target">
      <option value="fixtures/exfil/exfil_agent.py">fixtures/exfil/exfil_agent.py</option>
      <option value="fixtures/vulnerable_agent.py">fixtures/vulnerable_agent.py</option>
      <option value="fixtures/hardened_agent.py">fixtures/hardened_agent.py</option>
      <option value="fixtures/exfil/exfil_hardened.py">fixtures/exfil/exfil_hardened.py</option>
    </select>
    <button class="primary" id="run">Run full audit</button>
    <button id="runall">Scan all</button>
    <button id="reset">Reset</button>
  </header>

  <nav class="tabs">
    <button class="on" data-v="overview">Overview</button>
    <button data-v="org">Org-wide</button>
    <button data-v="policy">Policy &amp; Remediation</button>
    <button data-v="agents">Discovered agents</button>
  </nav>

  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SEV=['critical','high','medium','low','info'];
const COLOR={critical:'var(--crit)',high:'var(--high)',medium:'var(--med)',low:'var(--low)',info:'var(--info)'};
const GRADE={A:'#3FB98A',B:'#8CC152',C:'#F6EC72',D:'#D9772A',F:'#F0486B'};
let STATE=null, VIEW='overview', SORT={k:'score',dir:-1};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m)=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200);};

function verified(ts){
  return `<div class="verified">last verified: <b>${ts?esc(ts):'never — not run yet'}</b></div>`;
}
function emptyBox(title,reason,cls=''){
  return `<div class="empty ${cls}"><div class="t">${esc(title)}</div><div>${esc(reason)}</div></div>`;
}

const ICON={
  architectural:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="7" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8 7l8 .5M7 8l4 8M17 9l-4 7"/></svg>',
  behavioral:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a4 4 0 0 0-4 4 3 3 0 0 0-2 5 3 3 0 0 0 2 5 4 4 0 0 0 8 0 3 3 0 0 0 2-5 3 3 0 0 0-2-5 4 4 0 0 0-4-4Z"/><path d="M12 7v13"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.3A3.5 3.5 0 0 1 18 18Z"/></svg>'
};
const STAGES=[['architectural','static / trust graph'],['behavioral','behavioral'],['cloud','posture']];

function ring(score,grade){
  const r=52,c=2*Math.PI*r,off=c*(1-(score/100));
  const col=GRADE[grade]||'var(--muted)';
  return `<svg class="ring" viewBox="0 0 126 126">
    <circle cx="63" cy="63" r="${r}" fill="none" stroke="#232D42" stroke-width="11"/>
    <circle cx="63" cy="63" r="${r}" fill="none" stroke="${col}" stroke-width="11"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 63 63)"/>
    <text x="63" y="58" text-anchor="middle" font-family="IBM Plex Sans" font-size="34"
      font-weight="700" fill="${col}">${esc(grade)}</text>
    <text x="63" y="80" text-anchor="middle" font-family="IBM Plex Mono" font-size="12"
      fill="#8B97A7">${score}/100</text></svg>`;
}

function pipeline(scan,running){
  return `<div class="pipe">${STAGES.map(([k,label],i)=>{
    let st='pend',stxt='NOT RUN',detail='Awaiting a real scan.',bar='';
    if(running){st='run';stxt='RUNNING';detail='Executing real backend call…';
                bar='class="pbar" style="width:66%"';}
    if(scan){
      const lr=(scan.layers||[]).find(l=>l.layer===k);
      if(lr){st=lr.status==='ran'?'ran':'skipped';stxt=lr.status.toUpperCase();
             detail=lr.detail;bar='class="pbar done"';}
      if(k==='architectural'){
        const n=(scan.findings||[]).filter(f=>f.layer==='architectural').length;
        detail=`${n} finding(s) incl. trust-graph capability pairs`;
      }
    }
    return `<div class="stage"><div class="h"><span class="icn">${ICON[k]}</span>
      <span class="n">${label}</span><span class="st ${st}">${stxt}</span></div>
      <div class="detail">${esc(detail)}</div>
      <div class="barwrap"><div ${bar||'class="pbar"'}></div></div></div>`;
  }).join('')}</div>`;
}

function findingsList(findings){
  if(!findings||!findings.length)
    return emptyBox('No findings','This scan returned zero findings.');
  const order={critical:4,high:3,medium:2,low:1,info:0};
  return [...findings].sort((a,b)=>order[b.severity]-order[a.severity]).map(f=>{
    const rem=f.remediation||null;
    return `<details class="f" style="--sev:${COLOR[f.severity]}">
      <summary class="frow"><span class="dot"></span>
        <span class="sv">${esc(f.severity.toUpperCase())}</span>
        <span class="tag">${esc(f.layer)}</span>
        <span class="fmain"><span class="d">${esc(f.detector)}</span>
        <span class="s"> · ${esc((f.metadata&&(f.metadata.tool||f.metadata.tool_b))||f.location||'')}</span></span>
      </summary>
      <div class="fbody">
        <div>${esc(f.description)}</div>
        <div class="kv">location <b>${esc(f.location||'n/a')}</b> · confidence <b>${esc(f.confidence)}</b>
        ${f.evidence?`<br>evidence <b>${esc(f.evidence)}</b>`:''}</div>
        ${rem?`<div class="kv" style="color:var(--pass)">FIX — ${esc(rem.summary)}</div>
        ${(rem.before||rem.after)?`<pre>${rem.before.split('\n').map(l=>`<span class="del">- ${esc(l)}</span>`).join('\n')}
${rem.after.split('\n').map(l=>`<span class="add">+ ${esc(l)}</span>`).join('\n')}</pre>`:''}`:''}
      </div></details>`;
  }).join('');
}

function viewOverview(running){
  const scans=STATE?STATE.scans:{};
  const keys=Object.keys(scans);
  const cur=keys.length?scans[document.getElementById('target').value]||scans[keys[keys.length-1]]:null;
  let h=verified(cur?cur.generated_at:null);
  h+=`<h2 class="sec">3-stage pipeline</h2>`+pipeline(cur,running);
  if(!cur) return h+emptyBox('No audit has been run yet',
      'Choose a target and press “Run full audit”. Every number shown will come from that real run.');
  h+=`<h2 class="sec">Result</h2><div class="summary">${ring(cur.score,cur.grade)}
     <div class="sumtxt"><div class="tgt">${esc(cur.target)}</div>
     <div class="chips">${SEV.slice(0,4).map(s=>`<span class="chip ${cur.counts[s]?'':'zero'}">
       <span class="sw" style="background:${COLOR[s]}"></span>${cur.counts[s]} ${s}</span>`).join('')}</div>
     <div class="verified" style="margin-top:12px">scan took <b>${(cur.duration_ms/1000).toFixed(2)}s</b>
       · policies generated <b>${(cur.policies||[]).length}</b></div></div></div>`;
  h+=`<h2 class="sec">Findings (${cur.findings.length})</h2>`+findingsList(cur.findings);
  return h;
}

function viewOrg(){
  const org=STATE?STATE.org:null;
  let h=verified(org&&org.last_verified);
  if(!org||org.state!=='live')
    return h+emptyBox('No agents scanned yet',
      (org&&org.reason)||'Run “Scan all” to audit multiple agents and see org-wide totals.');
  h+=`<h2 class="sec">Org-wide totals — ${org.agent_count} agent(s), ${org.total_findings} finding(s)</h2>
      <div class="chips" style="margin-bottom:16px">${SEV.slice(0,4).map(s=>
      `<span class="chip ${org.totals[s]?'':'zero'}"><span class="sw" style="background:${COLOR[s]}"></span>
        ${org.totals[s]} ${s}</span>`).join('')}</div>`;
  const rows=Object.entries(org.per_agent).map(([t,c])=>{
    const sc=STATE.scans[t]||{};
    return {target:t,score:sc.score??0,grade:sc.grade??'?',...c,
            total:SEV.reduce((a,s)=>a+(c[s]||0),0)};
  });
  rows.sort((a,b)=>(a[SORT.k]>b[SORT.k]?1:a[SORT.k]<b[SORT.k]?-1:0)*SORT.dir);
  h+=`<table><thead><tr>
      ${[['target','Agent'],['grade','Grade'],['score','Risk'],['critical','Crit'],
         ['high','High'],['medium','Med'],['low','Low'],['total','Total']]
        .map(([k,l])=>`<th data-sort="${k}">${l}${SORT.k===k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('')}
      </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-target="${esc(r.target)}">
        <td class="mono">${esc(r.target)}</td>
        <td class="grade" style="color:${GRADE[r.grade]||'var(--muted)'}">${esc(r.grade)}</td>
        <td class="mono">${r.score}/100</td>
        <td class="mono" style="color:var(--crit)">${r.critical}</td>
        <td class="mono" style="color:var(--high)">${r.high}</td>
        <td class="mono" style="color:var(--med)">${r.medium}</td>
        <td class="mono" style="color:var(--low)">${r.low}</td>
        <td class="mono">${r.total}</td></tr>`).join('')}</tbody></table>
      <div class="verified" style="margin-top:10px">click a row to drill into that agent's findings</div>`;
  return h;
}

function viewPolicy(){
  const p=STATE?STATE.policies:null;
  let h=verified(STATE&&STATE.last_verified);
  if(!p||p.state!=='live')
    return h+emptyBox('No Cedar policies generated yet',
      (p&&p.reason)||'Run an audit on an agent with a HIGH/CRITICAL capability pair.');
  h+=`<h2 class="sec">Generated Cedar policies (${p.count})</h2>`;
  h+=p.policies.map(pol=>{
    const cls=pol.status==='active'?'active':(pol.status==='error'?'error':'dry');
    return `<details class="f" style="--sev:${pol.status==='active'?'var(--pass)':'var(--muted2)'}">
      <summary class="frow"><span class="dot"></span>
        <span class="fmain"><span class="d">${esc(pol.policy_name)}</span>
        <span class="s"> · ${esc(pol.file)}</span></span>
        <span class="pill ${cls}">${esc(pol.status)}</span>
        <button data-toggle="${esc(pol.id)}" data-status="${esc(pol.status)}">
          ${pol.status==='active'?'Disable':'Enable (live)'}</button>
      </summary>
      <div class="fbody">
        ${pol.error?`<div class="kv" style="color:var(--crit)">error: ${esc(pol.error)}</div>`:''}
        <div class="kv">policy id <b>${esc(pol.policy_id||'— (not deployed)')}</b>
          · generated <b>${esc(pol.timestamp||'n/a')}</b></div>
        <pre>${esc(pol.cedar)}</pre>
      </div></details>`;
  }).join('');
  return h;
}

function viewAgents(){
  const a=STATE?STATE.agents:null;
  let h=verified(a&&a.discovered_at);
  if(!a||a.state==='unavailable')
    return h+emptyBox('Agent discovery unavailable',
      (a&&a.reason)||'AWS discovery API not reachable.','unavail');
  if(a.state==='empty')
    return h+emptyBox('No agents found',(a.reason)||'No agent runtimes in this account/region.');
  h+=`<h2 class="sec">Discovered agents (${a.count}) — source: ${esc(a.source)}</h2>
      <table><thead><tr><th>Name</th><th>Runtime ID</th><th>Status</th><th>ARN</th></tr></thead>
      <tbody>${a.agents.map(g=>`<tr><td>${esc(g.name)}</td><td class="mono">${esc(g.agent_id)}</td>
      <td class="mono">${esc(g.status)}</td><td class="mono">${esc(g.arn)}</td></tr>`).join('')}
      </tbody></table>`;
  return h;
}

function render(running=false){
  const v=document.getElementById('view');
  v.innerHTML = VIEW==='overview'?viewOverview(running)
              : VIEW==='org'?viewOrg()
              : VIEW==='policy'?viewPolicy() : viewAgents();

  v.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; SORT.dir = SORT.k===k? -SORT.dir : -1; SORT.k=k; render();
  });
  v.querySelectorAll('tr[data-target]').forEach(tr=>tr.onclick=()=>{
    document.getElementById('target').value=tr.dataset.target;
    VIEW='overview'; syncTabs(); render();
  });
  v.querySelectorAll('button[data-toggle]').forEach(b=>b.onclick=(e)=>{
    e.preventDefault(); e.stopPropagation();
    const live=b.dataset.status!=='active';
    const msg=live
      ? 'Deploy this Cedar policy LIVE to AgentCore?\n\nIt will actively DENY the tool call for all callers.'
      : 'Disable this live policy?\n\nThe blocked tool call will be permitted again.';
    if(!confirm(msg)) return;
    toast('Live policy toggling requires AgentCore Policy permissions (see infra/AgentAuditPlatformPolicy.json). No change was made.');
  });
}
function syncTabs(){document.querySelectorAll('nav.tabs button')
  .forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));}

async function refresh(){ STATE=await (await fetch('/api/state')).json(); render(); }

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  VIEW=b.dataset.v; syncTabs(); render();});

document.getElementById('run').onclick=async()=>{
  const btn=document.getElementById('run'); btn.disabled=true; btn.textContent='Running…';
  VIEW='overview'; syncTabs(); render(true);
  try{
    const t=document.getElementById('target').value;
    const r=await (await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({target:t})})).json();
    if(r.error) toast('Scan failed: '+r.error); else toast('Audit complete — real results loaded.');
  }catch(e){toast('Scan failed: '+e);}
  btn.disabled=false; btn.textContent='Run full audit'; await refresh();
};
document.getElementById('runall').onclick=async()=>{
  const targets=[...document.getElementById('target').options].map(o=>o.value);
  const btn=document.getElementById('runall'); btn.disabled=true; btn.textContent='Scanning…';
  try{
    await fetch('/api/scan-all',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({targets})});
    toast(`Org-wide scan complete — ${targets.length} agents.`);
  }catch(e){toast('Org scan failed: '+e);}
  btn.disabled=false; btn.textContent='Scan all'; VIEW='org'; syncTabs(); await refresh();
};
document.getElementById('reset').onclick=async()=>{
  if(!confirm('Clear all scan state?\n\nThe dashboard will return to its empty state.')) return;
  await fetch('/api/reset',{method:'POST'}); toast('State cleared.'); await refresh();
};
document.getElementById('target').onchange=()=>render();
refresh();
</script>
</body>
</html>
