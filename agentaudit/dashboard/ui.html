<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentAudit — Security Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b13; --bg2:#0f111c;
    --text:#f2f2f6; --muted:#9a9bb0; --muted2:#7d7e94; --muted3:#6f7086;
    --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --line:rgba(255,255,255,.10);
    --a1:#a996ff; --a2:#ff6ec7;
    --grad:linear-gradient(135deg,#a996ff 0%,#ff6ec7 100%);
    --pass:#5ee6a8;
    --crit:#ff5470; --high:#ffb020; --med:#c9a6ff; --low:#5cc8ff; --info:#8b8ca3;
    --sans:'Manrope',system-ui,sans-serif; --display:'Sora',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{scrollbar-color:#2a2c3d transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a2c3d;border-radius:8px}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  code,.mono{font-family:var(--mono)}
  a{color:var(--a1);text-decoration:none}a:hover{color:var(--a2)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spinIco{to{transform:rotate(360deg)}}
  @keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(240%)}}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  @keyframes drift{0%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-48%,-3%) scale(1.08)}100%{transform:translate(-50%,0) scale(1)}}

  /* ambient background */
  .aurora,.aurora2,.grid{position:fixed;pointer-events:none;z-index:0}
  .aurora{top:-22%;left:50%;width:1100px;height:680px;
    background:radial-gradient(closest-side,color-mix(in srgb,#7c6cff 34%,transparent),transparent 70%);
    filter:blur(12px);animation:drift 16s ease-in-out infinite}
  .aurora2{top:6%;left:4%;width:520px;height:520px;
    background:radial-gradient(closest-side,color-mix(in srgb,#ff6ec7 20%,transparent),transparent 70%);
    filter:blur(14px)}
  .grid{inset:0;opacity:.5;
    background-image:radial-gradient(color-mix(in srgb,white 6%,transparent) 1px,transparent 1px);
    background-size:26px 26px}

  .wrap{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:0 34px 90px}

  /* header */
  header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px 22px;
    padding:16px 34px;margin:0 -34px 6px;flex-wrap:wrap;
    background:rgba(10,11,19,.62);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;
    letter-spacing:-.01em;white-space:nowrap}
  .brand svg{filter:drop-shadow(0 0 7px rgba(169,150,255,.65))}
  .brand .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted2);margin-left:4px}
  .live-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);white-space:nowrap}
  .live-chip .d{width:7px;height:7px;border-radius:50%;background:var(--pass);
    box-shadow:0 0 8px var(--pass);animation:glowPulse 2s infinite}
  .live-chip span:last-child{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  header .spacer{flex:1}

  .actions{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .act-group{display:flex;flex-direction:column;gap:6px}
  .act-label{font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
  .act-row{display:flex;gap:9px}
  .act-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 0}
  .act-group.remote .act-label{color:var(--a1)}

  select,input{font-family:var(--mono);font-size:12.5px;background:var(--glass);
    color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:.16s}
  select:hover,input:hover{border-color:rgba(255,255,255,.24)}
  select:focus,input:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(169,150,255,.15)}
  select{width:250px}
  #repo-url{min-width:250px}
  #repo-url::placeholder{color:var(--muted3)}

  button{font-family:var(--display);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
    border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--text);
    padding:9px 16px;display:inline-flex;align-items:center;gap:8px;transition:.18s}
  button:hover{background:var(--glass2);border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
  button.primary{background:var(--grad);color:#0a0b13;border-color:transparent;
    box-shadow:0 0 22px rgba(169,150,255,.34)}
  button.primary:hover{filter:brightness(1.06);box-shadow:0 0 30px rgba(169,150,255,.5)}
  button.ghost{background:transparent;color:var(--muted);border-color:transparent}
  button.ghost:hover{color:var(--text);background:var(--glass)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}

  nav.tabs{display:flex;gap:6px;padding:16px 0 20px;flex-wrap:wrap}
  nav.tabs button{border-radius:999px;color:var(--muted2);font-size:13px;padding:9px 17px;border-color:transparent}
  nav.tabs button:hover{color:var(--text);background:var(--glass);transform:none}
  nav.tabs button.on{background:rgba(169,150,255,.13);border-color:rgba(169,150,255,.4);color:#fff;
    box-shadow:0 0 20px rgba(169,150,255,.18)}

  .verified{font-family:var(--mono);font-size:12px;color:var(--muted3);margin:6px 0 4px;
    display:flex;align-items:center;gap:8px}
  .verified b{color:var(--muted);font-weight:600}
  .verified .cur{width:7px;height:13px;background:var(--a1);display:inline-block;animation:blink 1.1s steps(1) infinite}

  h2.sec{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted2);font-weight:700;margin:34px 0 14px}

  .view-anim{animation:fadeUp .5s ease both}

  /* empty / unavailable */
  .empty{background:var(--glass);border:1px dashed var(--line);border-radius:18px;
    padding:48px 34px;text-align:center;color:var(--muted);display:flex;flex-direction:column;
    align-items:center;gap:11px;backdrop-filter:blur(8px)}
  .empty .ei{width:42px;height:42px;color:var(--muted3)}
  .empty .t{font-family:var(--display);font-weight:700;font-size:16px;color:var(--text)}
  .empty .r{max-width:56ch;font-size:13.5px;line-height:1.55}
  .empty .cta{margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--a1);
    border:1px solid rgba(169,150,255,.35);border-radius:10px;padding:9px 15px;background:rgba(169,150,255,.08)}
  .unavail{border-style:solid;border-left:3px solid var(--high)}
  .unavail .ei{color:var(--high)}

  /* persistent error */
  .errbox{background:rgba(255,84,112,.09);border:1px solid rgba(255,84,112,.5);
    border-left:3px solid var(--crit);border-radius:14px;padding:16px 18px;margin-bottom:16px;
    display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(8px)}
  .errbox .ei{width:20px;height:20px;color:var(--crit);flex:0 0 auto;margin-top:2px}
  .errbox .body{flex:1;min-width:0}
  .errbox .h{font-family:var(--display);font-weight:700;color:var(--crit);font-size:14px;margin-bottom:3px}
  .errbox .msg{font-family:var(--mono);font-size:12px;color:#ffc9d4;word-break:break-word;
    background:rgba(0,0,0,.28);border-radius:8px;padding:8px 10px;margin-top:7px}
  .errbox .acts{display:flex;gap:8px;margin-top:11px}
  .errbox button{font-size:12px;padding:7px 13px}

  /* file:// guard */
  #file-guard{position:relative;z-index:30;background:var(--high);color:#241202;font-size:13px;
    font-weight:600;padding:10px 16px;text-align:center}
  #file-guard code{background:rgba(0,0,0,.18);padding:1px 6px;border-radius:4px}

  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-bottom:8px}
  .stage{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;
    backdrop-filter:blur(10px);animation:fadeUp .5s ease both}
  .stage .h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .stage .h .n{font-family:var(--display);font-weight:700;font-size:15px;flex:1}
  .stage .icn{width:18px;height:18px;color:var(--a1)}
  .st{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
    padding:3px 9px;border-radius:999px}
  .st.ran{background:rgba(94,230,168,.13);color:var(--pass)}
  .st.pend,.st.skipped{background:var(--glass2);color:var(--muted)}
  .st.run{background:rgba(92,200,255,.14);color:var(--low)}
  .st.error{background:rgba(255,84,112,.16);color:var(--crit)}
  .stage.errored{border-color:rgba(255,84,112,.5)}
  .stage .detail{font-size:12.5px;color:var(--muted);line-height:1.45;min-height:34px}
  .barwrap{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:12px;position:relative}
  .pbar{height:100%;width:0;background:var(--a1);border-radius:999px;transition:width .9s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
  .pbar.done{background:var(--pass);width:100%}
  .pbar .shine{position:absolute;inset:0;width:40%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:shimmer 2.1s ease-in-out infinite}

  /* hero / result */
  .hero{display:flex;gap:34px;align-items:center;background:var(--glass);border:1px solid var(--line);
    border-radius:20px;padding:28px 30px;margin-bottom:8px;flex-wrap:wrap;backdrop-filter:blur(10px)}
  .ringwrap{position:relative;width:168px;height:168px;flex:0 0 auto}
  .ringwrap .glow{position:absolute;inset:-16px;border-radius:50%;filter:blur(7px)}
  .ring{position:relative}
  .ring .gv{font-family:var(--display);font-weight:800;font-size:52px;line-height:1}
  .ring .sv{font-family:var(--mono);font-size:12px;fill:var(--muted)}
  .herotxt{flex:1;min-width:260px}
  .herotxt .tgt{font-family:var(--mono);font-size:13px;color:var(--muted);word-break:break-all;margin-bottom:6px}
  .herotxt h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.03;
    letter-spacing:-.02em;margin:2px 0 10px}
  .herotxt h1 .g{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .herotxt .lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px;max-width:60ch}
  .chips{display:flex;gap:9px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass2);display:flex;align-items:center;gap:8px}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip.zero{opacity:.4}
  .herotxt .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted3);margin-top:14px}
  .herotxt .meta b{color:var(--muted)}

  /* findings */
  details.f{background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--sev);
    border-radius:14px;margin-bottom:10px;overflow:hidden;backdrop-filter:blur(10px);
    transition:transform .18s ease,border-color .18s ease;animation:fadeUp .45s ease both}
  details.f:hover{transform:translateY(-3px)}
  details.f[open]{background:var(--glass2)}
  summary.frow{list-style:none;cursor:pointer;padding:15px 17px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  summary.frow::-webkit-details-marker{display:none}
  summary.frow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--a1)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--sev);box-shadow:0 0 10px var(--sev);flex:0 0 auto}
  .sv{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--sev);width:64px;flex:0 0 auto}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;flex:0 0 auto}
  .fmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .fmain .d{font-family:var(--mono);font-weight:600;font-size:13px}
  .fmain .s{font-family:var(--mono);font-size:11.5px;color:var(--muted3)}
  .fbody{padding:2px 17px 17px 44px;font-size:13px;color:#c6d0dc;line-height:1.6}
  .kv{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:10px 0}
  .kv b{color:var(--text);font-weight:500}
  .kv.fix{color:var(--pass)}
  pre{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-family:var(--mono);font-size:11.5px;overflow-x:auto;margin:0}
  pre .add{color:#69d19b}pre .del{color:#ff8fa6}

  /* tables */
  .tbl{background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 15px;font-size:13px;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted2);
    text-transform:uppercase;cursor:pointer;user-select:none;background:var(--glass2)}
  th:hover{color:var(--text)}
  tr:last-child td{border-bottom:none}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--glass2)}
  td.mono{font-family:var(--mono);font-size:12px}
  .grade{font-family:var(--display);font-weight:800;font-size:15px}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:999px}
  .pill.dry{background:var(--glass2);color:var(--muted)}
  .pill.active{background:rgba(94,230,168,.14);color:var(--pass)}
  .pill.error{background:rgba(255,84,112,.16);color:var(--crit)}

  .toast{position:fixed;right:22px;bottom:22px;background:var(--bg2);border:1px solid var(--line);
    border-left:3px solid var(--a1);border-radius:12px;padding:13px 16px;font-size:13px;max-width:400px;
    display:none;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.5)}

  @media (max-width:820px){ header.bar{gap:12px} .hero{gap:22px} }
</style>
</head>
<body>
<div id="file-guard" hidden>
  <strong>This page needs to be served.</strong>
  Run <code>agentaudit dashboard</code> from the project root — don't open this file directly.
</div>

<div class="aurora"></div><div class="aurora2"></div><div class="grid"></div>

<div class="wrap">
  <header class="bar">
    <div class="brand">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a996ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span><span class="g">Agent</span>Audit</span>
      <span class="sub">security console</span>
    </div>
    <span class="live-chip"><span class="d"></span><span id="datamode">live data — nothing mocked</span></span>
    <div class="spacer"></div>
    <div class="actions">
      <div class="act-group">
        <span class="act-label">one agent</span>
        <div class="act-row">
          <select id="target" title="The agent source file to audit">
            <option value="fixtures/exfil/exfil_agent.py">fixtures/exfil/exfil_agent.py</option>
            <option value="fixtures/vulnerable_agent.py">fixtures/vulnerable_agent.py</option>
            <option value="fixtures/hardened_agent.py">fixtures/hardened_agent.py</option>
            <option value="fixtures/exfil/exfil_hardened.py">fixtures/exfil/exfil_hardened.py</option>
          </select>
          <button class="primary" id="run" title="Run the full 3-layer audit against the selected agent">Run full audit</button>
        </div>
      </div>
      <div class="act-sep" aria-hidden="true"></div>
      <div class="act-group remote">
        <span class="act-label">or scan a public GitHub repo</span>
        <div class="act-row">
          <input id="repo-url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 pattern="https://github\.com/.+"
                 placeholder="https://github.com/owner/repo"
                 title="A public GitHub repo URL. Shallow-cloned read-only; its code is never executed, only AST-parsed by the Layer 2 analyzer.">
          <button class="primary" id="run-remote" title="Shallow-clone the repo (read-only) and run the Layer 2 static trust-graph audit against its source">Run full audit</button>
        </div>
      </div>
      <div class="act-sep" aria-hidden="true"></div>
      <div class="act-group">
        <span class="act-label">every target</span>
        <button id="runall" title="Audit every agent in the list above, then open the org-wide view">Scan all &rarr; org view</button>
      </div>
      <button class="ghost" id="reset" title="Clear all scan state and return the console to its empty state">Reset</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="on" data-v="overview">Overview</button>
    <button data-v="org">Org-wide</button>
    <button data-v="policy">Policy &amp; Remediation</button>
    <button data-v="agents">Discovered agents</button>
  </nav>

  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
if (window.location.protocol === 'file:') {
  document.getElementById('file-guard').hidden = false;
}

const SEV=['critical','high','medium','low','info'];
const COLOR={critical:'var(--crit)',high:'var(--high)',medium:'var(--med)',low:'var(--low)',info:'var(--info)'};
const GRADE={A:'#5ee6a8',B:'#8fe39a',C:'#ffb020',D:'#ff8a4c',F:'#ff5470'};
let STATE=null, VIEW='overview', SORT={k:'score',dir:-1};
let LAST_ERROR=null, RUNNING=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m)=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200);};

const ICO_EMPTY='<svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3.5"/><path d="M20.5 18.5 23 21"/></svg>';
const ICO_WARN='<svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg>';
const ICO_ERR='<svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';

function verified(ts){
  return `<div class="verified">last verified: <b>${ts?esc(ts):'never — not run yet'}</b><span class="cur"></span></div>`;
}
function emptyBox(title,reason,cls='',cta=''){
  const icon = cls==='unavail' ? ICO_WARN : ICO_EMPTY;
  return `<div class="empty ${cls}">${icon}<div class="t">${esc(title)}</div>`
       + `<div class="r">${esc(reason)}</div>${cta?`<div class="cta">${esc(cta)}</div>`:''}</div>`;
}
function errorBanner(){
  if(!LAST_ERROR) return '';
  return `<div class="errbox">${ICO_ERR}<div class="body">
    <div class="h">${esc(LAST_ERROR.scope)} failed</div>
    <div>The backend returned an error. Nothing was scanned — the numbers below are unchanged.</div>
    <div class="msg">${esc(LAST_ERROR.message)}</div>
    <div class="acts">
      <button class="primary" id="err-retry">Retry</button>
      <button class="ghost" id="err-dismiss">Dismiss</button>
    </div></div></div>`;
}

const ICON={
  architectural:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>',
  behavioral:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>'
};
const STAGES=[['architectural','static / trust graph'],['behavioral','behavioral'],['cloud','posture']];

function ring(score,grade){
  const r=74,c=2*Math.PI*r,off=c*(1-(score/100));
  const col=GRADE[grade]||'var(--muted)';
  return `<div class="ringwrap">
    <div class="glow" style="background:radial-gradient(closest-side, color-mix(in srgb, ${col} 45%, transparent), transparent 72%)"></div>
    <svg class="ring" width="168" height="168" viewBox="0 0 168 168">
      <circle cx="84" cy="84" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
      <circle cx="84" cy="84" r="${r}" fill="none" stroke="${col}" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 84 84)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/>
      <text class="gv" x="84" y="80" text-anchor="middle" dominant-baseline="middle"
        fill="${col}" style="text-shadow:0 0 26px ${col}">${esc(grade)}</text>
      <text class="sv" x="84" y="112" text-anchor="middle">${score}/100</text>
    </svg></div>`;
}

function headline(counts,total){
  if(counts.critical) return ['CRITICAL RISK','DETECTED'];
  if(counts.high) return ['HIGH RISK','DETECTED'];
  if(total) return ['REVIEW','NEEDED'];
  return ['NO ISSUES','FOUND'];
}

function pipeline(scan,running){
  const errored = !!LAST_ERROR && !running;
  return `<div class="pipe">${STAGES.map(([k,label],i)=>{
    let st='pend',stxt='NOT RUN',detail='Awaiting a real scan.',bar='',cls='';
    if(errored && !scan){
      st='error';stxt='ERROR';detail='The last run failed before this stage produced a result.';cls=' errored';
    } else if(running){
      st='run';stxt='RUNNING';detail='Executing real backend call…';
      bar=`<div class="pbar" style="width:66%"><div class="shine"></div></div>`;
    }
    if(scan){
      const lr=(scan.layers||[]).find(l=>l.layer===k);
      if(lr){st=lr.status==='ran'?'ran':(lr.status==='error'?'error':'skipped');
             stxt=lr.status.toUpperCase();detail=lr.detail;
             bar=`<div class="pbar done"></div>`;
             if(lr.status==='error') cls=' errored';}
      if(k==='architectural' && (!lr || lr.status==='ran')){
        const n=(scan.findings||[]).filter(f=>f.layer==='architectural').length;
        detail=`${n} finding(s) incl. trust-graph capability pairs`;
      }
    }
    return `<div class="stage${cls}" style="animation-delay:${i*.08}s"><div class="h"><span class="icn">${ICON[k]}</span>
      <span class="n">${label}</span><span class="st ${st}">${stxt}</span></div>
      <div class="detail">${esc(detail)}</div>
      <div class="barwrap">${bar}</div></div>`;
  }).join('')}</div>`;
}

function findingsList(findings){
  if(!findings||!findings.length)
    return emptyBox('No findings','This scan returned zero findings.');
  const order={critical:4,high:3,medium:2,low:1,info:0};
  return [...findings].sort((a,b)=>order[b.severity]-order[a.severity]).map((f,i)=>{
    const rem=f.remediation||null;
    return `<details class="f" style="--sev:${COLOR[f.severity]};animation-delay:${.05+i*.05}s">
      <summary class="frow"><span class="dot"></span>
        <span class="sv">${esc(f.severity.toUpperCase())}</span>
        <span class="tag">${esc(f.layer)}</span>
        <span class="fmain"><span class="d">${esc(f.detector)}</span>
        <span class="s">· ${esc((f.metadata&&(f.metadata.tool||f.metadata.tool_b))||f.location||'')}</span></span>
      </summary>
      <div class="fbody">
        <div>${esc(f.description)}</div>
        <div class="kv">location <b>${esc(f.location||'n/a')}</b> · confidence <b>${esc(f.confidence)}</b>
        ${f.evidence?`<br>evidence <b>${esc(f.evidence)}</b>`:''}</div>
        ${rem?`<div class="kv fix">FIX — ${esc(rem.summary)}</div>
        ${(rem.before||rem.after)?`<pre>${rem.before.split('\n').map(l=>`<span class="del">- ${esc(l)}</span>`).join('\n')}
${rem.after.split('\n').map(l=>`<span class="add">+ ${esc(l)}</span>`).join('\n')}</pre>`:''}`:''}
      </div></details>`;
  }).join('');
}

function viewOverview(running){
  const scans=STATE?STATE.scans:{};
  const keys=Object.keys(scans);
  const cur=keys.length?scans[document.getElementById('target').value]||scans[keys[keys.length-1]]:null;
  let h=`<div class="view-anim">`+errorBanner()+verified(cur?cur.generated_at:null);
  h+=`<h2 class="sec">3-stage pipeline</h2>`+pipeline(cur,running);
  if(!cur) return h+emptyBox(
      'No audit has been run yet',
      'AgentAudit only ever shows numbers from a real scan. Pick an agent under “one agent”, paste a public GitHub repo, then press Run full audit — the 3-layer pipeline fills in with live results.',
      '', 'Run full audit  →  static · behavioral · posture')+`</div>`;
  const hl=headline(cur.counts, cur.findings.length);
  h+=`<h2 class="sec">Result</h2><div class="hero">${ring(cur.score,cur.grade)}
     <div class="herotxt"><div class="tgt">${esc(cur.target)}</div>
     <h1><span class="g">${hl[0]}</span><span>${hl[1]}</span></h1>
     <p class="lead">${cur.counts.critical} critical and ${cur.counts.high} high severity finding(s) across the static, behavioral and posture pipeline.</p>
     <div class="chips">${SEV.slice(0,4).map(s=>`<span class="chip ${cur.counts[s]?'':'zero'}">
       <span class="sw" style="background:${COLOR[s]}"></span>${cur.counts[s]} ${s}</span>`).join('')}</div>
     <div class="meta">scan took <b>${(cur.duration_ms/1000).toFixed(2)}s</b>
       · policies generated <b>${(cur.policies||[]).length}</b>
       ${cur.source==='remote-github'?`· source <b>public GitHub repo (static only)</b>${cur.license?` · license <b>${esc(cur.license)}</b>`:' · license <b>none declared</b>'}`:''}</div>
     </div></div>`;
  h+=`<h2 class="sec">Findings (${cur.findings.length})</h2>`+findingsList(cur.findings);
  return h+`</div>`;
}

function viewOrg(){
  const org=STATE?STATE.org:null;
  let h=`<div class="view-anim">`+errorBanner()+verified(org&&org.last_verified);
  if(!org||org.state!=='live')
    return h+emptyBox('No agents scanned yet',
      (org&&org.reason)||'Run “Scan all” to audit multiple agents and see org-wide totals.')+`</div>`;
  h+=`<h2 class="sec">Org-wide totals — ${org.agent_count} agent(s), ${org.total_findings} finding(s)</h2>
      <div class="chips" style="margin-bottom:18px">${SEV.slice(0,4).map(s=>
      `<span class="chip ${org.totals[s]?'':'zero'}"><span class="sw" style="background:${COLOR[s]}"></span>
        ${org.totals[s]} ${s}</span>`).join('')}</div>`;
  const rows=Object.entries(org.per_agent).map(([t,c])=>{
    const sc=STATE.scans[t]||{};
    return {target:t,score:sc.score??0,grade:sc.grade??'?',...c,
            total:SEV.reduce((a,s)=>a+(c[s]||0),0)};
  });
  rows.sort((a,b)=>(a[SORT.k]>b[SORT.k]?1:a[SORT.k]<b[SORT.k]?-1:0)*SORT.dir);
  h+=`<div class="tbl"><table><thead><tr>
      ${[['target','Agent'],['grade','Grade'],['score','Risk'],['critical','Crit'],
         ['high','High'],['medium','Med'],['low','Low'],['total','Total']]
        .map(([k,l])=>`<th data-sort="${k}">${l}${SORT.k===k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('')}
      </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-target="${esc(r.target)}">
        <td class="mono">${esc(r.target)}</td>
        <td class="grade" style="color:${GRADE[r.grade]||'var(--muted)'}">${esc(r.grade)}</td>
        <td class="mono">${r.score}/100</td>
        <td class="mono" style="color:var(--crit)">${r.critical}</td>
        <td class="mono" style="color:var(--high)">${r.high}</td>
        <td class="mono" style="color:var(--med)">${r.medium}</td>
        <td class="mono" style="color:var(--low)">${r.low}</td>
        <td class="mono">${r.total}</td></tr>`).join('')}</tbody></table></div>
      <div class="verified" style="margin-top:12px">click a row to drill into that agent's findings</div>`;
  return h+`</div>`;
}

function viewPolicy(){
  const p=STATE?STATE.policies:null;
  let h=`<div class="view-anim">`+errorBanner()+verified(STATE&&STATE.last_verified);
  if(!p||p.state!=='live')
    return h+emptyBox('No Cedar policies generated yet',
      (p&&p.reason)||'Run an audit on an agent with a HIGH/CRITICAL capability pair.')+`</div>`;
  h+=`<h2 class="sec">Generated Cedar policies (${p.count})</h2>`;
  h+=p.policies.map(pol=>{
    const cls=pol.status==='active'?'active':(pol.status==='error'?'error':'dry');
    const col=pol.status==='active'?'var(--pass)':'var(--muted2)';
    return `<details class="f" style="--sev:${col}">
      <summary class="frow"><span class="dot"></span>
        <span class="fmain"><span class="d">${esc(pol.policy_name)}</span>
        <span class="s">· ${esc(pol.file)}</span></span>
        <span class="pill ${cls}">${esc(pol.status)}</span>
        <button data-toggle="${esc(pol.id)}" data-status="${esc(pol.status)}">
          ${pol.status==='active'?'Disable':'Enable (live)'}</button>
      </summary>
      <div class="fbody">
        ${pol.error?`<div class="kv" style="color:var(--crit)">error: ${esc(pol.error)}</div>`:''}
        <div class="kv">policy id <b>${esc(pol.policy_id||'— (not deployed)')}</b>
          · generated <b>${esc(pol.timestamp||'n/a')}</b></div>
        <pre>${esc(pol.cedar)}</pre>
      </div></details>`;
  }).join('');
  return h+`</div>`;
}

function viewAgents(){
  const a=STATE?STATE.agents:null;
  let h=`<div class="view-anim">`+errorBanner()+verified(a&&a.discovered_at);
  if(!a||a.state==='unavailable')
    return h+emptyBox('Agent discovery unavailable',
      (a&&a.reason)||'AWS discovery API not reachable.','unavail')+`</div>`;
  if(a.state==='empty')
    return h+emptyBox('No agents found',(a.reason)||'No agent runtimes in this account/region.')+`</div>`;
  h+=`<h2 class="sec">Discovered agents (${a.count}) — source: ${esc(a.source)}</h2>
      <div class="tbl"><table><thead><tr><th>Name</th><th>Runtime ID</th><th>Status</th><th>ARN</th></tr></thead>
      <tbody>${a.agents.map(g=>`<tr><td>${esc(g.name)}</td><td class="mono">${esc(g.agent_id)}</td>
      <td class="mono">${esc(g.status)}</td><td class="mono">${esc(g.arn)}</td></tr>`).join('')}
      </tbody></table></div>`;
  return h+`</div>`;
}

function render(running=false){
  const v=document.getElementById('view');
  v.innerHTML = VIEW==='overview'?viewOverview(running)
              : VIEW==='org'?viewOrg()
              : VIEW==='policy'?viewPolicy() : viewAgents();

  const rt=v.querySelector('#err-retry'); if(rt) rt.onclick=()=>
    (LAST_ERROR && /^https:\/\/github\.com\//.test(LAST_ERROR.target||'')) ? runRemote() : runOne();
  const dm=v.querySelector('#err-dismiss'); if(dm) dm.onclick=()=>{ LAST_ERROR=null; render(); };

  v.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; SORT.dir = SORT.k===k? -SORT.dir : -1; SORT.k=k; render();
  });
  v.querySelectorAll('tr[data-target]').forEach(tr=>tr.onclick=()=>{
    document.getElementById('target').value=tr.dataset.target;
    VIEW='overview'; syncTabs(); render();
  });
  v.querySelectorAll('button[data-toggle]').forEach(b=>b.onclick=(e)=>{
    e.preventDefault(); e.stopPropagation();
    const live=b.dataset.status!=='active';
    const msg=live
      ? 'Deploy this Cedar policy LIVE to AgentCore?\n\nIt will actively DENY the tool call for all callers.'
      : 'Disable this live policy?\n\nThe blocked tool call will be permitted again.';
    if(!confirm(msg)) return;
    toast('Live policy toggling requires AgentCore Policy permissions (see infra/AgentAuditPlatformPolicy.json). No change was made.');
  });
}
function syncTabs(){document.querySelectorAll('nav.tabs button')
  .forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));}

async function refresh(){ STATE=await (await fetch('/api/state')).json(); render(); }

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  VIEW=b.dataset.v; syncTabs(); render();});

async function runOne(){
  const btn=document.getElementById('run'); const label=btn.textContent;
  btn.disabled=true; btn.textContent='Running…'; RUNNING=true; LAST_ERROR=null;
  VIEW='overview'; syncTabs(); render(true);
  try{
    const t=document.getElementById('target').value;
    const r=await (await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({target:t})})).json();
    if(r.error){ LAST_ERROR={scope:'Audit of '+t, target:t, message:r.error}; }
    else { toast('Audit complete — real results loaded.'); }
  }catch(e){ LAST_ERROR={scope:'Audit', message:String(e)}; }
  RUNNING=false; btn.disabled=false; btn.textContent=label; await refresh();
}
async function runAll(){
  const btn=document.getElementById('runall'); const label=btn.innerHTML;
  const targets=[...document.getElementById('target').options].map(o=>o.value)
    .filter(v=>v.startsWith('fixtures/'));
  btn.disabled=true; btn.textContent='Scanning…'; RUNNING=true; LAST_ERROR=null;
  try{
    const r=await (await fetch('/api/scan-all',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({targets})})).json();
    if(r.error){ LAST_ERROR={scope:'Org-wide scan', message:r.error}; }
    else { toast(`Org-wide scan complete — ${targets.length} agents.`); }
  }catch(e){ LAST_ERROR={scope:'Org-wide scan', message:String(e)}; }
  RUNNING=false; btn.disabled=false; btn.innerHTML=label;
  VIEW = LAST_ERROR ? 'overview' : 'org'; syncTabs(); await refresh();
}
async function runRemote(){
  const inp=document.getElementById('repo-url');
  const btn=document.getElementById('run-remote'); const label=btn.textContent;
  const url=(inp.value||'').trim();
  if(!/^https:\/\/github\.com\/.+/.test(url)){
    LAST_ERROR={scope:'Remote scan', message:'Enter a URL of the form https://github.com/<owner>/<repo>.'};
    VIEW='overview'; syncTabs(); render(); return;
  }
  btn.disabled=true; inp.disabled=true; btn.textContent='Cloning…'; RUNNING=true; LAST_ERROR=null;
  VIEW='overview'; syncTabs(); render(true);
  try{
    const r=await (await fetch('/api/scan-remote',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})})).json();
    if(r.error){ LAST_ERROR={scope:'Remote scan of '+url, target:url, message:r.error}; }
    else if(r.scan){
      const key=r.scan.target;
      const sel=document.getElementById('target');
      if(![...sel.options].some(o=>o.value===key)){
        const o=document.createElement('option'); o.value=key; o.textContent=key; sel.appendChild(o);
      }
      sel.value=key;
      toast('Remote audit complete — '+(r.scan.findings||[]).length+' finding(s) from '+key+'.');
    }
  }catch(e){ LAST_ERROR={scope:'Remote scan', message:String(e)}; }
  RUNNING=false; btn.disabled=false; inp.disabled=false; btn.textContent=label;
  VIEW='overview'; syncTabs(); await refresh();
}
document.getElementById('run').onclick=runOne;
document.getElementById('runall').onclick=runAll;
document.getElementById('run-remote').onclick=runRemote;
document.getElementById('repo-url').addEventListener('keydown',e=>{ if(e.key==='Enter') runRemote(); });
document.getElementById('reset').onclick=async()=>{
  if(!confirm('Clear all scan state?\n\nThe dashboard will return to its empty state.')) return;
  await fetch('/api/reset',{method:'POST'}); toast('State cleared.'); await refresh();
};
document.getElementById('target').onchange=()=>render();
refresh();
</script>
</body>
</html>
