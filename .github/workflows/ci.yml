name: agentaudit-ci

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integrity guard (fixtures + detectors unchanged)
        run: ./guard.sh check
      - name: Palette is colorblind-safe
        run: python scripts/check_palette.py
      - name: Unit + contract tests
        run: pytest -q
      - name: Self-audit — vulnerable fixture must FAIL the gate
        run: |
          if python -m agentaudit run --agent fixtures/vulnerable_agent.py --out out/vuln; then
            echo "::error::vulnerable fixture unexpectedly passed the gate"; exit 1
          fi
      - name: Self-audit — hardened fixture must PASS the gate
        run: python -m agentaudit run --agent fixtures/hardened_agent.py --out out/hard
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/vuln/report.sarif
        continue-on-error: true
      - name: Regenerate grade badge from the hardened scan (push only)
        if: github.event_name == 'push'
        run: |
          python scripts/make_badge.py --json out/hard/report.signed.json --out docs/agentaudit-badge.svg
          if ! git diff --quiet docs/agentaudit-badge.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/agentaudit-badge.svg
            git commit -m "ci: refresh agentaudit grade badge [skip ci]"
            git push
          fi

  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit the PR's demo target
        run: python -m agentaudit run --agent fixtures/vulnerable_agent.py --out out/pr || true
      - name: Build Markdown comment
        run: python scripts/render_pr_comment.py --json out/pr/report.signed.json > comment.md
      - name: Post (or update) the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- agentaudit -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const payload = marker + "\n" + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload });
            }
